<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="64.5802mm" viewBox="0 0 1310 470">
<title>Tensor program autotuning workflow</title>
<desc>Tensor computation and target hardware define a schedule search space. A budgeted loop generates candidates, compiles, validates and benchmarks them, and updates search using measurement feedback. The result is the best measured valid candidate.</desc>
<rect width="1310" height="470" fill="white"/>
<path d="M 476,31 L 1041,31 L 1041,449 L 476,449 Z" fill="#FFFFFF" stroke="#7D8792" stroke-width="1.3" stroke-linejoin="miter" stroke-dasharray="7 5"/>
<text x="758.5" y="63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Budgeted tuning loop</text>
<path d="M 24,110 L 208,110 L 208,284 L 24,284 Z" fill="#FFFFFF" stroke="#20262D" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="116" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Inputs</text>
<path d="M 37,157 L 195,157" fill="none" stroke="#B7BDC4" stroke-width="1" stroke-linejoin="miter"/>
<text x="116" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#20262D">Tensor computation</text>
<text x="116" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Target hardware</text>
<path d="M 250,110 L 448,110 L 448,284 L 250,284 Z" fill="#FFFFFF" stroke="#20262D" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="349" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Search space</text>
<path d="M 263,157 L 435,157" fill="none" stroke="#B7BDC4" stroke-width="1" stroke-linejoin="miter"/>
<text x="349" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Tiling and loop order</text>
<text x="349" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Memory placement</text>
<text x="349" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Vectorization</text>
<text x="349" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Parallel mapping</text>
<path d="M 498,110 L 722,110 L 722,284 L 498,284 Z" fill="#F3F6F9" stroke="#365A78" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="610" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Candidate search</text>
<path d="M 511,157 L 709,157" fill="none" stroke="#BAC7D3" stroke-width="1" stroke-linejoin="miter"/>
<text x="610" y="201" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Generate schedules</text>
<text x="610" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Select candidates</text>
<path d="M 772,110 L 1018,110 L 1018,284 L 772,284 Z" fill="#F3F6F9" stroke="#365A78" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="895" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Program evaluation</text>
<path d="M 785,157 L 1005,157" fill="none" stroke="#BAC7D3" stroke-width="1" stroke-linejoin="miter"/>
<text x="895" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Compile for target</text>
<text x="895" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Check correctness</text>
<text x="895" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Measure latency</text>
<path d="M 1080,110 L 1286,110 L 1286,284 L 1080,284 Z" fill="#FFFFFF" stroke="#20262D" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="1183" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Tuned program</text>
<path d="M 1093,157 L 1273,157" fill="none" stroke="#B7BDC4" stroke-width="1" stroke-linejoin="miter"/>
<text x="1183" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">Best measured</text>
<text x="1183" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#20262D">valid candidate</text>
<path d="M 208,202 L 250,202" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 250,202 L 242,205.8 L 242,198.2 Z" fill="#20262D" stroke="#20262D" stroke-width="1" stroke-linejoin="miter"/>
<path d="M 448,202 L 498,202" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 498,202 L 490,205.8 L 490,198.2 Z" fill="#20262D" stroke="#20262D" stroke-width="1" stroke-linejoin="miter"/>
<path d="M 722,202 L 772,202" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 772,202 L 764,205.8 L 764,198.2 Z" fill="#20262D" stroke="#20262D" stroke-width="1" stroke-linejoin="miter"/>
<path d="M 1018,202 L 1080,202" fill="none" stroke="#20262D" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 1080,202 L 1072,205.8 L 1072,198.2 Z" fill="#20262D" stroke="#20262D" stroke-width="1" stroke-linejoin="miter"/>
<path d="M 548,349 L 973,349 L 973,437 L 548,437 Z" fill="#F3F6F9" stroke="#365A78" stroke-width="1.6" stroke-linejoin="miter"/>
<text x="760.5" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#20262D">Measurement feedback</text>
<text x="760.5" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Update search state</text>
<text x="760.5" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#20262D">Update cost model (optional)</text>
<path d="M 895,284 L 895,349" fill="none" stroke="#365A78" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 895,349 L 891.2,341 L 898.8,341 Z" fill="#365A78" stroke="#365A78" stroke-width="1" stroke-linejoin="miter"/>
<text x="906" y="314" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4B5563">Record results</text>
<path d="M 610,349 L 610,284" fill="none" stroke="#365A78" stroke-width="1.8" stroke-linejoin="miter"/>
<path d="M 610,284 L 613.8,292 L 606.2,292 Z" fill="#365A78" stroke="#365A78" stroke-width="1" stroke-linejoin="miter"/>
<text x="597" y="314" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4B5563">Guide search</text>
<text x="1183" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B5563">Return at budget limit</text>
</svg>